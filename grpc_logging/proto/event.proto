syntax = "proto3";
package helium3.logging;

import "google/protobuf/empty.proto";

message EventMsg {
  string machine_id    = 1;
  int32  state         = 2;
  string name          = 3;
  int64  start_ns      = 4;
  int64  duration_ns   = 5;
  string message       = 6;
  bool   complete      = 7;
}

service Logger {
  rpc LogEvent(EventMsg) returns (google.protobuf.Empty);
}
